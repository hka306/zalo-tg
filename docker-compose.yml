services:
  zalo-tg:
    build: .
    image: zalo-tg:latest
    container_name: zalo-tg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ZALO_TG_RUNNER=1
      - DATA_DIR=/app/data
      - ZALO_CREDENTIALS_PATH=/app/data/credentials.json
    volumes:
      # Persistent data — lưu topics.json + credentials.json
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
