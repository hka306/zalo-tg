name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vps
    strategy:
      matrix:
        node-version: [20, 22]
    env:
      TG_TOKEN: test-token
      TG_GROUP_ID: -1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: vps/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: vps/go.mod
          cache: true
          cache-dependency-path: vps/go.sum
      - run: npm ci
      - run: go test ./...
      - run: npm run tui:build
      - run: npm run check
      - run: npm run security:audit

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
